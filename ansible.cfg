[defaults]
inventory = inventory/
roles_path = ./roles
interpreter_python = /usr/bin/python3
inventory_ignore_extensions = ~, .orig, .bak, .cfg, .retry, .pyc, .pyo, .example
# Facts survive between runs (gitignored folder). The WireGuard public keys are cached this way, so one spoke that
# does not answer today does not stop the hub's config, which lists every spoke's key, from being rendered.
fact_caching = jsonfile
fact_caching_connection = .facts_cache
fact_caching_timeout = 0
# sudo through the SSH agent can take longer than the default 10 s on a busy host
timeout = 30

[ssh_connection]
ssh_args = -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
