---
# Daedalus monitoring: a private WireGuard network to the monitoring centre, and an agent on every host.
# Separate from k3s.yml on purpose: it never touches the k3s role or its firewall template.
# Always run for the whole group: the hub's tunnel config lists every spoke's public key.
- name: WireGuard and the Daedalus agent
  hosts: wireguard
  become: true
  vars_files: [vars/daedalus_version.yml]
  roles:
    # on the hub, only when a spoke is behind the public VPN (wireguard_via_vpn): up before wg0 talks to it
    - role: vpn_egress
      tags: [wireguard, vpn]
      when: >-
        inventory_hostname == wireguard_hub and
        groups['wireguard'] | map('extract', hostvars) | selectattr('wireguard_via_vpn', 'defined')
        | selectattr('wireguard_via_vpn') | list | length > 0
    - role: wireguard
      tags: wireguard
    - role: daedalus_agent
      tags: agent

# The backup server checks its own backups: jobs, dumps, disk forecast, and a weekly test restore.
# Its agent (above) reads the results.
- name: Backup checks
  hosts: daedalus_checks
  become: true
  vars_files: [vars/daedalus_version.yml]
  roles:
    - role: daedalus_checks
      tags: checks

# The public front: the UI on its own server, /api to the hub through the tunnel inside the VPN.
- name: Public front
  hosts: daedalus_front
  become: true
  vars_files: [vars/daedalus_version.yml]
  roles:
    - role: daedalus_front
      tags: front
