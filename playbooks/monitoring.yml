---
# Daedalus monitoring: a private WireGuard network to the monitoring centre, and an agent on every host.
# Separate from k3s.yml on purpose: it never touches the k3s role or its firewall template.
# Always run for the whole group: the hub's tunnel config lists every spoke's public key.
- name: WireGuard and the Daedalus agent
  hosts: wireguard
  become: true
  roles:
    - role: wireguard
      tags: wireguard
    - role: daedalus_agent
      tags: agent

# The backup server checks the databases it backs up: a ping, and a daily test restore of the newest dump.
# Its agent (above) reads the results; connection strings live in that host's host_vars.
- name: Database checks
  hosts: daedalus_checks
  become: true
  roles:
    - role: daedalus_checks
      tags: checks
