# What runs on every host of monitoring.yml: one commit of the Daedalus repo, the full 40-character sha.
# Manifests, Alloy configs, the check script and the agent image all come from it (CI tags each image with its
# commit sha), so nothing changes on a server until this line does. To update: put the new commit here and run
# monitoring.yml. The image of a commit exists once "Build and push images" has passed for it on GitHub.
daedalus_version: 7997fbdb90bca610f883972173904ae90c0983af     # agents report public addresses, the hub checks them from outside (PR #17)
