---
# The Daedalus monitoring agent and log collector, one per host. Needs wg0 first (roles/wireguard): the agent
# listens on the WireGuard address only, and logs go to Loki on the hub through the tunnel.
#   k3s hosts:    Argo CD Applications for k8s/agent (port 9001) and logs/ (Alloy DaemonSet) of the Daedalus repo
#   Docker hosts: docker compose in /opt/daedalus-agent (agent on port 9000, Alloy next to it)
daedalus_agent_repo_url: https://github.com/ArturSkrin/daedalus-infra-health.git

# daedalus_version (a commit sha) is set in playbooks/vars/daedalus_version.yml; manifests, configs and the image follow it
daedalus_agent_revision: "{{ daedalus_version }}"

# Docker hosts: the agent image and the socket proxy in front of docker.sock
daedalus_agent_image: "ghcr.io/arturskrin/daedalus-infra-health-backend:{{ daedalus_version }}"
daedalus_agent_socket_proxy_image: tecnativa/docker-socket-proxy:0.3.0
daedalus_agent_dir: /opt/daedalus-agent

# Docker hosts: Alloy sends container logs and the journal to Loki (docker-compose.fleet-logs.yaml on the hub)
daedalus_agent_alloy_image: grafana/alloy:v1.20.1
daedalus_agent_alloy_url: "https://raw.githubusercontent.com/ArturSkrin/daedalus-infra-health/{{ daedalus_agent_revision }}/logs"
daedalus_agent_loki_url: "http://{{ hostvars[wireguard_hub].wireguard_address }}:3100/loki/api/v1/push"
