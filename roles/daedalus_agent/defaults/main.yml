---
# The Daedalus monitoring agent, one per host. Needs wg0 first (roles/wireguard): it listens on the WireGuard address only.
#   k3s hosts:    an Argo CD Application for k8s/agent of the Daedalus repo (port 9001)
#   Docker hosts: docker compose in /opt/daedalus-agent (port 9000)
daedalus_agent_repo_url: https://github.com/ArturSkrin/daedalus-infra-health.git
daedalus_agent_revision: feat/fleet-agent

# Docker hosts: the agent image and the socket proxy in front of docker.sock
daedalus_agent_image: ghcr.io/arturskrin/daedalus-infra-health-backend:feat-fleet-agent
daedalus_agent_socket_proxy_image: tecnativa/docker-socket-proxy:0.3.0
daedalus_agent_dir: /opt/daedalus-agent
