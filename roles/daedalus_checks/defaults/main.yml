---
# Backup checks for Daedalus on the backup server (checks/daedalus_checks.py from the Daedalus repo):
#   hourly: result of every backup job, the newest dump of every database (age, readable, size), disk forecast
#   weekly: full test restore of every newest dump into a throwaway postgres container
# Every directory under daedalus_checks_postgres_dir is a database: nothing per database, no credentials.
daedalus_checks_revision: "{{ daedalus_version }}"     # playbooks/daedalus_version.yml
daedalus_checks_script_url: "https://raw.githubusercontent.com/ArturSkrin/daedalus-infra-health/{{ daedalus_checks_revision }}/checks/daedalus_checks.py"

daedalus_checks_postgres_dir: /var/backups/postgres
daedalus_checks_jobs: [postgres-backup, file-backup, github-to-gitea-backup]   # systemd services, without .service
daedalus_checks_max_dump_age_h: 26                 # dumps are daily
daedalus_checks_restore_image: postgres:17         # must be at least the pg_dump version that made the dumps
daedalus_checks_restore_at: "Sun *-*-* 12:00:00"
