---
# Version of the sealed-secrets Helm chart.
sealed_secrets_chart_version: "2.20.0"

# Own key pair, generated once with openssl and kept out of Git (files/ is gitignored).
# The same key on every rebuild = SealedSecrets in app repos keep working after a migration.
sealed_secrets_cert_file: "{{ playbook_dir | dirname }}/files/sealed-secrets/sealed-secrets.crt"
sealed_secrets_key_file: "{{ playbook_dir | dirname }}/files/sealed-secrets/sealed-secrets.key"

sealed_secrets_values:
  # kubeseal looks for "sealed-secrets-controller" in kube-system by default
  fullnameOverride: sealed-secrets-controller
  # No automatic key rotation: the key is managed by us, not generated by the controller
  keyrenewperiod: "0"
