---
# reload = `wg syncconf`: peers change without taking wg0 down, so anything bound to its address keeps running
- name: Reload WireGuard
  ansible.builtin.systemd_service:
    name: wg-quick@{{ wireguard_interface }}
    state: reloaded

# reload recreates host_firewall from /etc/nftables.conf, then the drop-in appends our rules: no duplicates
- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
    daemon_reload: true
