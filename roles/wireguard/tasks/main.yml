---
- name: Stop if the tunnel is not described in the inventory
  ansible.builtin.assert:
    that:
      - wireguard_address is defined
      - wireguard_hub is defined
      - wireguard_hub in groups['wireguard']
    fail_msg: "{{ inventory_hostname }}: set wireguard_address on the host and wireguard_hub for the group"

# A spoke behind the VPN must never get a handshake straight from the hub: no VPN on the hub, no tunnel at all.
- name: Stop if a spoke is behind the VPN but the hub has no VPN
  ansible.builtin.assert:
    that: hostvars[wireguard_hub].vpn_private_key is defined
    fail_msg: "{{ inventory_hostname }}: wireguard_via_vpn is set, but {{ wireguard_hub }} has no vpn_* in host_vars"
  when: >-
    groups['wireguard'] | map('extract', hostvars) | selectattr('wireguard_via_vpn', 'defined')
    | selectattr('wireguard_via_vpn') | list | length > 0

- name: Install wireguard-tools (the module is in the Ubuntu kernel)
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
    update_cache: true
    lock_timeout: 90

- name: Create /etc/wireguard
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

# Generated on the host, once. It never leaves it: not in Git, not in Ansible output, not in the config file.
- name: Generate the private key
  ansible.builtin.shell: umask 077 && wg genkey > /etc/wireguard/{{ wireguard_interface }}.key
  args:
    creates: /etc/wireguard/{{ wireguard_interface }}.key

# In --check on a new host there is no key (and maybe no `wg`) yet: the preview shows a placeholder instead of failing.
- name: Read the public key
  ansible.builtin.shell: wg pubkey < /etc/wireguard/{{ wireguard_interface }}.key
  register: wireguard_pubkey
  changed_when: false
  check_mode: false
  failed_when: wireguard_pubkey.rc != 0 and not ansible_check_mode

# The hub's config is built from every spoke's public key: run the play for the whole group, not with --limit.
# cacheable: kept in the fact cache (ansible.cfg), so the hub still knows this key on a run where this host is down
- name: Share the public key with the other hosts
  ansible.builtin.set_fact:
    wireguard_public_key: "{{ wireguard_pubkey.stdout or 'NEW-KEY-IS-GENERATED-ON-THE-FIRST-REAL-RUN' }}"
    cacheable: "{{ not ansible_check_mode }}"

- name: Host firewall rules for the tunnel
  ansible.builtin.import_tasks: firewall.yml

- name: Render the tunnel config
  ansible.builtin.template:
    src: wg.conf.j2
    dest: /etc/wireguard/{{ wireguard_interface }}.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart WireGuard

# In --check on a new host wireguard-tools is not installed yet, so the wg-quick@ unit does not exist to preview.
- name: Enable and start the tunnel
  ansible.builtin.systemd_service:
    name: wg-quick@{{ wireguard_interface }}
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
